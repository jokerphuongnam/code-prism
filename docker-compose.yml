services:
  swift-prism:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swift-prism-dev
    volumes:
      - ./core/Sources:/app/core/Sources:ro
      - ./extension/src:/app/extension/src:ro
      - ./extension/webview/src:/app/extension/webview/src:ro
      - swift-prism-bin:/app/extension/bin
      - swift-prism-out:/app/extension/out
      - swift-prism-dist:/app/extension/dist-webview
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    restart: unless-stopped

volumes:
  swift-prism-bin:
  swift-prism-out:
  swift-prism-dist:
